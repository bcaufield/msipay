<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSI Pay — Invoice Management Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f3;
    --color-background-tertiary: #eeede9;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #6b6b67;
    --color-text-tertiary: #9e9e99;
    --color-border-tertiary: rgba(0,0,0,0.1);
    --color-border-secondary: rgba(0,0,0,0.18);
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
    --border-radius-md: 8px;
    --border-radius-lg: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --color-background-primary: #1e1e1c;
      --color-background-secondary: #2a2a28;
      --color-background-tertiary: #141412;
      --color-text-primary: #f0efe9;
      --color-text-secondary: #9e9e96;
      --color-text-tertiary: #6b6b67;
      --color-border-tertiary: rgba(255,255,255,0.08);
      --color-border-secondary: rgba(255,255,255,0.14);
    }
  }
  body { font-family: var(--font-sans); background: var(--color-background-tertiary); color: var(--color-text-primary); }
  .app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--color-background-primary); border-right: 0.5px solid var(--color-border-tertiary); display: flex; flex-direction: column; }
  .sidebar-logo { padding: 18px 16px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .logo-text { font-size: 15px; font-weight: 500; color: var(--color-text-primary); letter-spacing: -0.3px; }
  .logo-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .role-switcher { padding: 10px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); }
  .role-label { font-size: 10px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .role-select { width: 100%; font-size: 12px; padding: 5px 8px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-primary); cursor: pointer; }
  .nav { flex: 1; padding: 8px 0; overflow-y: auto; }
  .nav-section { padding: 12px 16px 4px; font-size: 10px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 16px; font-size: 13px; color: var(--color-text-secondary); cursor: pointer; transition: background 0.1s; }
  .nav-item:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .nav-item.active { background: var(--color-background-secondary); color: var(--color-text-primary); font-weight: 500; border-right: 2px solid #1D9E75; }
  .nav-item i { font-size: 15px; flex-shrink: 0; }
  .nav-badge { margin-left: auto; background: #E24B4A; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { height: 52px; background: var(--color-background-primary); border-bottom: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; padding: 0 20px; gap: 12px; }
  .topbar-title { font-size: 15px; font-weight: 500; color: var(--color-text-primary); flex: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 13px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; transition: background 0.1s; font-family: var(--font-sans); }
  .btn:hover { background: var(--color-background-secondary); }
  .btn.primary { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .btn.primary:hover { background: #0F6E56; }
  .btn.danger { background: #E24B4A; border-color: #E24B4A; color: #fff; }
  .btn.danger:hover { background: #A32D2D; }
  .btn.sm { padding: 4px 10px; font-size: 12px; }
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 16px 20px; margin-bottom: 16px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 12px 14px; }
  .metric-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .metric-sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--color-background-secondary); }
  .badge { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 9px; border-radius: 10px; font-weight: 500; white-space: nowrap; }
  .badge.pending { background: #FAEEDA; color: #854F0B; }
  .badge.approved { background: #EAF3DE; color: #3B6D11; }
  .badge.review { background: #E6F1FB; color: #185FA5; }
  .badge.rejected { background: #FCEBEB; color: #A32D2D; }
  .badge.draft { background: #F1EFE8; color: #5F5E5A; }
  .badge.received { background: #EAF3DE; color: #3B6D11; }
  .badge.outstanding { background: #FAEEDA; color: #854F0B; }
  .badge.active { background: #EAF3DE; color: #3B6D11; }
  .badge.complete { background: #E6F1FB; color: #185FA5; }
  .action-row { display: flex; gap: 6px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-row.full { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 12px; color: var(--color-text-secondary); }
  .form-input { padding: 7px 10px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-family: var(--font-sans); }
  .form-input:focus { outline: none; border-color: #1D9E75; box-shadow: 0 0 0 2px rgba(29,158,117,0.15); }
  textarea.form-input { resize: vertical; }
  .sov-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .sov-table th { background: var(--color-background-secondary); padding: 7px 10px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); border: 0.5px solid var(--color-border-tertiary); text-align: right; white-space: nowrap; }
  .sov-table th:first-child, .sov-table th:nth-child(2) { text-align: left; }
  .sov-table td { padding: 8px 10px; border: 0.5px solid var(--color-border-tertiary); text-align: right; color: var(--color-text-primary); }
  .sov-table td:first-child, .sov-table td:nth-child(2) { text-align: left; }
  .sov-table tr.total-row td { font-weight: 500; background: var(--color-background-secondary); }
  .progress-bar { height: 4px; background: var(--color-background-secondary); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: #1D9E75; border-radius: 2px; }
  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 100; align-items: center; justify-content: center; }
  .modal-backdrop.open { display: flex; }
  .modal { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-secondary); width: 640px; max-height: 85vh; overflow-y: auto; padding: 24px; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 16px; font-weight: 500; }
  .modal-close { cursor: pointer; color: var(--color-text-secondary); font-size: 18px; background: none; border: none; line-height: 1; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 0.5px solid var(--color-border-tertiary); }
  .sub-avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 500; flex-shrink: 0; }
  .divider { height: 0.5px; background: var(--color-border-tertiary); margin: 16px 0; }
  .step-indicator { display: flex; align-items: center; margin-bottom: 20px; }
  .step { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--color-text-tertiary); }
  .step.done { color: #1D9E75; }
  .step.active { color: var(--color-text-primary); font-weight: 500; }
  .step-dot { width: 20px; height: 20px; border-radius: 50%; border: 0.5px solid var(--color-border-secondary); display: flex; align-items: center; justify-content: center; font-size: 10px; background: var(--color-background-secondary); }
  .step.done .step-dot { background: #EAF3DE; border-color: #1D9E75; color: #1D9E75; }
  .step.active .step-dot { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .step-line { flex: 1; height: 0.5px; background: var(--color-border-tertiary); margin: 0 6px; }
  .alert { padding: 10px 14px; border-radius: var(--border-radius-md); font-size: 13px; margin-bottom: 14px; }
  .alert.info { background: #E6F1FB; color: #0C447C; border-left: 3px solid #185FA5; }
  .alert.warning { background: #FAEEDA; color: #633806; border-left: 3px solid #EF9F27; }
  .alert.success { background: #EAF3DE; color: #27500A; border-left: 3px solid #639922; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-text"><i class="ti ti-building-warehouse" style="color:#1D9E75;margin-right:6px"></i>MSI Pay</div>
      <div class="logo-sub">Miami Systems Inc.</div>
    </div>
    <div class="role-switcher">
      <div class="role-label">Viewing as</div>
      <select class="role-select" id="roleSelect" onchange="switchRole(this.value)">
        <option value="gc">GC / Project Manager</option>
        <option value="sub">Subcontractor</option>
        <option value="owner">Owner / Developer</option>
        <option value="accounting">Accounting / Finance</option>
      </select>
    </div>
    <div class="nav" id="navMenu"></div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">Invoice Dashboard</div>
      <div id="topbarActions"></div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
  <div class="modal" id="modalBody"></div>
</div>

<script>
const state = {
  role: 'gc', panel: 'dashboard',
  invoices: [
    { id:'INV-0041', sub:'Coastal Electric', trade:'Electrical', contract:'$184,000', billed:'$92,000', pct:50, status:'pending', period:'Apr 2026', project:'Palm Beach Warehouse Ph.1', lienStatus:'outstanding', draw:4 },
    { id:'INV-0040', sub:'SunState Plumbing', trade:'Plumbing', contract:'$97,500', billed:'$29,250', pct:30, status:'review', period:'Apr 2026', project:'Palm Beach Warehouse Ph.1', lienStatus:'received', draw:4 },
    { id:'INV-0039', sub:'Dade Drywall', trade:'Drywall', contract:'$62,000', billed:'$46,500', pct:75, status:'approved', period:'Mar 2026', project:'Palm Beach Warehouse Ph.1', lienStatus:'received', draw:3 },
    { id:'INV-0038', sub:'Tropical HVAC', trade:'HVAC', contract:'$143,000', billed:'$57,200', pct:40, status:'approved', period:'Mar 2026', project:'Palm Beach Warehouse Ph.1', lienStatus:'received', draw:3 },
    { id:'INV-0037', sub:'Coastal Electric', trade:'Electrical', contract:'$184,000', billed:'$55,200', pct:30, status:'approved', period:'Feb 2026', project:'Palm Beach Warehouse Ph.1', lienStatus:'received', draw:2 },
    { id:'INV-0036', sub:'SunState Plumbing', trade:'Plumbing', contract:'$97,500', billed:'$9,750', pct:10, status:'rejected', period:'Feb 2026', project:'Palm Beach Warehouse Ph.1', lienStatus:'outstanding', draw:2 },
  ],
  subs: [
    { name:'Coastal Electric', trade:'Electrical', contract:'$184,000', billed:'$147,200', pct:80, active:2, status:'active' },
    { name:'SunState Plumbing', trade:'Plumbing', contract:'$97,500', billed:'$39,000', pct:40, active:1, status:'active' },
    { name:'Dade Drywall', trade:'Drywall', contract:'$62,000', billed:'$46,500', pct:75, active:0, status:'active' },
    { name:'Tropical HVAC', trade:'HVAC', contract:'$143,000', billed:'$57,200', pct:40, active:1, status:'active' },
    { name:'Boca Concrete', trade:'Concrete', contract:'$88,000', billed:'$88,000', pct:100, active:0, status:'complete' },
  ],
  sov: [
    { num:'01', desc:'Site Work & Mobilization', value:48000, prev:48000, curr:0, stored:0 },
    { num:'02', desc:'Concrete Foundation', value:88000, prev:88000, curr:0, stored:0 },
    { num:'03', desc:'Structural Steel', value:124000, prev:96000, curr:0, stored:0 },
    { num:'04', desc:'Electrical Rough-In', value:92000, prev:55200, curr:36800, stored:0 },
    { num:'05', desc:'Plumbing Rough-In', value:48750, prev:9750, curr:19500, stored:0 },
    { num:'06', desc:'Drywall & Framing', value:62000, prev:31000, curr:15500, stored:0 },
    { num:'07', desc:'HVAC Equipment', value:143000, prev:57200, curr:0, stored:0 },
    { num:'08', desc:'Roofing', value:76000, prev:0, curr:0, stored:0 },
    { num:'09', desc:'Finishes & Painting', value:41000, prev:0, curr:0, stored:0 },
    { num:'10', desc:'Sitework & Paving', value:55000, prev:0, curr:0, stored:0 },
  ]
};

const navConfig = {
  gc: [
    { id:'dashboard', icon:'ti-layout-dashboard', label:'Dashboard' },
    { id:'invoices', icon:'ti-file-invoice', label:'Invoices', badge:2 },
    { id:'sov', icon:'ti-table', label:'Schedule of Values' },
    { id:'lienWaivers', icon:'ti-shield-check', label:'Lien Waivers', badge:1 },
    { id:'subcontractors', icon:'ti-users', label:'Subcontractors' },
  ],
  sub: [
    { id:'submitInvoice', icon:'ti-file-plus', label:'Submit Invoice' },
    { id:'myInvoices', icon:'ti-file-invoice', label:'My Invoices' },
    { id:'mySov', icon:'ti-table', label:'Schedule of Values' },
    { id:'myLienWaivers', icon:'ti-shield-check', label:'Lien Waivers' },
  ],
  owner: [
    { id:'ownerDashboard', icon:'ti-layout-dashboard', label:'Project Summary' },
    { id:'ownerInvoices', icon:'ti-file-invoice', label:'Pay Applications' },
    { id:'ownerSov', icon:'ti-table', label:'Schedule of Values' },
  ],
  accounting: [
    { id:'accDashboard', icon:'ti-layout-dashboard', label:'Payables Dashboard' },
    { id:'accInvoices', icon:'ti-file-invoice', label:'Approved Invoices' },
    { id:'accLiens', icon:'ti-shield-check', label:'Lien Tracker' },
  ]
};

const panelTitles = {
  dashboard:'Invoice Dashboard', invoices:'Invoice Review', sov:'Schedule of Values', lienWaivers:'Lien Waiver Tracker', subcontractors:'Subcontractor Management',
  submitInvoice:'Submit Pay Application', myInvoices:'My Invoices', mySov:'Schedule of Values', myLienWaivers:'My Lien Waivers',
  ownerDashboard:'Project Summary', ownerInvoices:'Pay Applications', ownerSov:'Schedule of Values',
  accDashboard:'Payables Dashboard', accInvoices:'Approved Invoices for Payment', accLiens:'Lien Waiver Tracker'
};

function switchRole(role) {
  state.role = role;
  state.panel = navConfig[role][0].id;
  renderNav(); renderTopbar(); renderPanel();
}
function setPanel(id) {
  state.panel = id;
  renderNav(); renderTopbar(); renderPanel();
}
function renderNav() {
  const nav = document.getElementById('navMenu');
  nav.innerHTML = '<div class="nav-section">Navigation</div>' + navConfig[state.role].map(item =>
    `<div class="nav-item ${state.panel===item.id?'active':''}" onclick="setPanel('${item.id}')">
      <i class="ti ${item.icon}"></i>${item.label}
      ${item.badge?`<span class="nav-badge">${item.badge}</span>`:''}
    </div>`).join('');
}
function renderTopbar() {
  document.getElementById('topbarTitle').textContent = panelTitles[state.panel] || '';
  const btns = {
    subcontractors:`<button class="btn primary sm" onclick="openAddSubModal()"><i class="ti ti-plus"></i> Add subcontractor</button>`,
    lienWaivers:`<button class="btn sm"><i class="ti ti-download"></i> Export</button>`,
    accLiens:`<button class="btn sm"><i class="ti ti-download"></i> Export</button>`,
  };
  document.getElementById('topbarActions').innerHTML = btns[state.panel] || '';
}
function fmt(n) { return '$' + Number(n).toLocaleString(); }
function statusBadge(s) {
  const labels = { pending:'Pending Review', review:'In Review', approved:'Approved', rejected:'Rejected', draft:'Draft', received:'Received', outstanding:'Outstanding', active:'Active', complete:'Complete' };
  return `<span class="badge ${s}">${labels[s]||s}</span>`;
}
function renderPanel() {
  const el = document.getElementById('mainContent');
  const p = state.panel;
  const map = { dashboard:renderGCDashboard, invoices:renderInvoices, sov:renderSOV, lienWaivers:renderLienWaivers, subcontractors:renderSubcontractors, submitInvoice:renderSubmitInvoice, myInvoices:renderMyInvoices, mySov:renderSOV, myLienWaivers:renderMyLienWaivers, ownerDashboard:renderOwnerDashboard, ownerInvoices:renderOwnerInvoices, ownerSov:renderSOV, accDashboard:renderAccDashboard, accInvoices:renderAccDashboard, accLiens:renderLienWaivers };
  el.innerHTML = (map[p] || (() => ''))();
}
function renderGCDashboard() {
  const pending = state.invoices.filter(i=>i.status==='pending'||i.status==='review');
  const lienOut = state.invoices.filter(i=>i.lienStatus==='outstanding').length;
  return `
  <div class="metrics">
    <div class="metric"><div class="metric-label">Total contract value</div><div class="metric-value">$572K</div><div class="metric-sub">Palm Beach Warehouse Ph.1</div></div>
    <div class="metric"><div class="metric-label">Billed to date</div><div class="metric-value">$331K</div><div class="metric-sub">58% of contract</div></div>
    <div class="metric"><div class="metric-label">Pending invoices</div><div class="metric-value">${pending.length}</div><div class="metric-sub">Awaiting action</div></div>
    <div class="metric"><div class="metric-label">Lien waivers outstanding</div><div class="metric-value">${lienOut}</div><div class="metric-sub">Require follow-up</div></div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">Overall project completion</div><span style="font-size:12px;color:var(--color-text-secondary)">Draw 4 — April 2026</span></div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="progress-bar" style="flex:1;height:8px"><div class="progress-fill" style="width:58%"></div></div>
      <span style="font-size:13px;font-weight:500">58%</span>
    </div>
  </div>
  <div class="card">
    <div class="card-header"><div class="card-title">Invoices awaiting review</div><button class="btn sm" onclick="setPanel('invoices')">View all</button></div>
    <div class="table-wrap"><table>
      <tr><th>Invoice</th><th>Subcontractor</th><th>Trade</th><th>Amount</th><th>Status</th><th>Action</th></tr>
      ${pending.map(inv=>`<tr>
        <td style="font-weight:500">${inv.id}</td><td>${inv.sub}</td><td style="color:var(--color-text-secondary)">${inv.trade}</td>
        <td style="font-weight:500">${inv.billed}</td><td>${statusBadge(inv.status)}</td>
        <td><button class="btn sm primary" onclick="openApproveModal('${inv.id}')">Review</button></td>
      </tr>`).join('')}
    </table></div>
  </div>`;
}
function renderInvoices() {
  return `
  <div class="alert info"><i class="ti ti-info-circle" style="margin-right:6px"></i><strong>2 invoices</strong> require your review before the Draw 4 payment window closes.</div>
  <div class="card">
    <div class="card-header"><div class="card-title">All invoices — Draw 4 · Palm Beach Warehouse</div></div>
    <div class="table-wrap"><table>
      <tr><th>Invoice #</th><th>Subcontractor</th><th>Trade</th><th>Period</th><th>Contract</th><th>This draw</th><th>% Comp.</th><th>Lien waiver</th><th>Status</th><th>Action</th></tr>
      ${state.invoices.map(inv=>`<tr>
        <td style="font-weight:500;font-family:var(--font-mono);font-size:12px">${inv.id}</td>
        <td>${inv.sub}</td><td style="color:var(--color-text-secondary)">${inv.trade}</td><td style="color:var(--color-text-secondary)">${inv.period}</td>
        <td>${inv.contract}</td><td style="font-weight:500">${inv.billed}</td>
        <td><div style="display:flex;align-items:center;gap:6px"><div class="progress-bar" style="width:60px"><div class="progress-fill" style="width:${inv.pct}%"></div></div><span style="font-size:11px;color:var(--color-text-secondary)">${inv.pct}%</span></div></td>
        <td>${statusBadge(inv.lienStatus)}</td><td>${statusBadge(inv.status)}</td>
        <td>${inv.status==='pending'||inv.status==='review'?`<button class="btn sm primary" onclick="openApproveModal('${inv.id}')">Review</button>`:`<button class="btn sm" onclick="openDetailModal('${inv.id}')">View</button>`}</td>
      </tr>`).join('')}
    </table></div>
  </div>`;
}
function renderSOV() {
  const tv=state.sov.reduce((a,r)=>a+r.value,0), tp=state.sov.reduce((a,r)=>a+r.prev,0), tc=state.sov.reduce((a,r)=>a+r.curr,0);
  const total=tp+tc, ret=Math.round(total*0.10);
  return `
  <div class="card" style="padding:0;overflow:hidden">
